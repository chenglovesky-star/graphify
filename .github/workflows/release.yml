name: Build and Release Binaries

# 触发条件:打 v* tag 自动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 允许手动触发(便于调试)

jobs:
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: 仅保留 Apple Silicon (主流)。Intel 用户可在 installer 里走降级路径
          # 或通过 Rosetta 运行 arm64 二进制。
          - os: macos-14
            arch: arm64
            asset_name: graphify-darwin-arm64
            exe_name: graphify
          - os: ubuntu-22.04
            arch: x64
            asset_name: graphify-linux-x64
            exe_name: graphify
          - os: ubuntu-22.04
            arch: arm64
            asset_name: graphify-linux-arm64
            exe_name: graphify
          - os: windows-2022
            arch: x64
            asset_name: graphify-windows-x64.exe
            exe_name: graphify.exe

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.arch }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.arch }}-

      - name: Install PyInstaller + graphify
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # 安装基础依赖(跳过可选依赖,降低打包体积)
          pip install --no-deps -e .
          # openai / tiktoken / httpx 是 graphify 运行时需要的(LLM 语义抽取)
          # 必须先装,否则 PyInstaller collect_all 找不到,二进制运行时报
          # "the 'openai' package is required but is not installed"
          pip install openai tiktoken httpx pydantic anyio distro jiter

      - name: Build binary
        run: pyinstaller --noconfirm graphify.spec

      - name: Verify binary works
        shell: bash
        run: |
          # onedir 模式: COLLECT 目录名恒为 graphify(spec name='graphify',跨平台一致)
          # 目录内可执行文件: Windows 为 graphify.exe,其他平台为 graphify
          binary="./dist/graphify/${{ matrix.exe_name }}"
          "$binary" --version || "$binary" --help | head -5

      - name: Upload artifact (onedir mode - upload entire directory)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          # onedir 产物是 dist/graphify/ 目录(包含 binary + _internal/),必须传目录而非文件
          # 目录名跨平台恒为 graphify(spec COLLECT name='graphify')
          path: dist/graphify/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts with rename
        # onedir 模式: 把整个 graphify/ 目录重命名为 graphify-<platform>
        # 这样 release 能上传单文件(.zip 包),用户解压后直接得到 onedir 结构
        # (binary + _internal/),保持 onedir 完整性
        run: |
          rm -rf /tmp/dist && mkdir -p /tmp/dist
          for dir in artifacts/*/; do
            artifact_name=$(basename "$dir")
            # 找 onedir 目录: 包含 binary 和 _internal/
            onedir_dir=""
            for candidate in \
              "$dir$artifact_name" \
              "$dir"; do
              if [ -d "$candidate/_internal" ]; then
                onedir_dir="$candidate"
                break
              fi
            done
            if [ -z "$onedir_dir" ]; then
              echo "WARNING: no _internal found for $artifact_name"
              continue
            fi
            # 重命名 onedir 目录,避免多个平台都叫 graphify/ 冲突
            renamed="/tmp/dist/${artifact_name}_onedir"
            mv "$onedir_dir" "$renamed"
            echo "moved: $onedir_dir -> $renamed"
          done
          echo ""
          echo "=== /tmp/dist/ contents ==="
          ls -la /tmp/dist/ | head -20
          echo "=== /tmp/dist/ contents ==="
          ls -lh /tmp/dist/

      - name: Generate SHA256SUMS
        working-directory: /tmp/dist
        run: |
          # onedir 模式: 打 zip 再算 sha256 (避免上传目录结构)
          for d in *_onedir; do
            [ -d "$d" ] || continue
            zip -r -q "${d}.zip" "$d"
            rm -rf "$d"
            sha256sum "${d}.zip"
          done > SHA256SUMS
          echo ""
          echo "=== /tmp/dist/ contents ==="
          ls -la /tmp/dist/
          echo ""
          echo "=== SHA256SUMS content ==="
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            /tmp/dist/graphify-darwin-arm64_onedir.zip
            /tmp/dist/graphify-linux-arm64_onedir.zip
            /tmp/dist/graphify-linux-x64_onedir.zip
            /tmp/dist/graphify-windows-x64_onedir.zip
            /tmp/dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify build result
    needs: [build, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Release: ${{ needs.release.result }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi